[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nodus-adapter-base"
version = "0.1.0"
description = "Abstract base for nodus channel adapters: reconnect loop, health recording, connection manager"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Masterplanner25" }]
dependencies = ["nodus-channels>=0.1.0", "nodus-http>=0.1.0", "nodus-events>=0.1.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.21"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nodus_adapter_base*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"